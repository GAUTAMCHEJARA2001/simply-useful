<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <script>
      // Prevent pinch-to-zoom on iOS Safari & mobile browsers
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      // Prevent multi-touch pinch zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap to zoom while preserving normal form input taps
      var lastTouchEndTime = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEndTime <= 300) {
          var tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT' && tag !== 'OPTION') {
            e.preventDefault();
          }
        }
        lastTouchEndTime = now;
      }, false);

      // Prevent trackpad / mouse pinch-to-zoom (ctrl + wheel)
      document.addEventListener('wheel', function(e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });
    </script>
    <!-- Set the document title to the name of your application -->
    <title>Simply Useful</title>
    <meta name="description" content="Kamla Industries - Enterprise Resource Planning" />
    <meta name="author" content="Kamla Industries" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Preconnect to Backend API to speed up TTFB -->
    <link rel="preconnect" href="https://simply-useful-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://simply-useful-backend.onrender.com" />

    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Simply Useful" />
    <meta property="og:description" content="Kamla Industries - Enterprise Resource Planning" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apple-touch-icon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@simply_useful" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Vercel Toolbar — enables in-production logs, feedback & inspection -->
    <script src="https://vercel.live/_next/static/chunks/integrations/vercel-toolbar.js" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
